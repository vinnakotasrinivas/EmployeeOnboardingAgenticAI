[project]
name = "onboardiq"
version = "0.1.0"
description = "Agentic RAG assistant that answers employee onboarding questions from company documents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tabulate>=0.10.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "slow: loads the real embedding model (a few seconds on first use)",
    "live: calls the real Groq API; needs network and GROQ_API_KEY (run with -m live)",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
]
